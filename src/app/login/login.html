<div class="section">
  <h2>Login</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm" class="form-container">

    <!-- Email -->
    <input
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
      email
      #emailInput="ngModel" />
    <div *ngIf="emailInput.invalid && emailInput.touched" class="error">
      Please enter a valid email.
    </div>

    <!-- Password with toggle -->
    <div class="password-container">
      <input
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        [type]="showPassword ? 'text' : 'password'"
        required
        #passwordInput="ngModel" />
      <button type="button" class="toggle-btn" (click)="showPassword = !showPassword">
        <span *ngIf="!showPassword">👁️</span>
        <span *ngIf="showPassword">🙈</span>
      </button>
    </div>
    <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error">
      Password is required.
    </div>

    <!-- Feedback messages -->
    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success">
      {{ successMessage }}
    </div>

    <!-- Submit -->
    <button type="submit" class="btn primary" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
</div>
